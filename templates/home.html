<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prediction Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      margin-top: 50px;
      max-width: 1000px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      color: #000000;
      font-weight: 600;
    }
    .message {
      margin: 20px 0;
      font-weight: 500;
      color: #333;
      font-size: 1.1rem;
    }
    table {
      margin-top: 20px;
    }
    th {
      background-color: #021121 !important;
      color: white !important;
    }
    .btn-custom {
      background: #00050b;
      color: white;
      font-weight: 500;
      border-radius: 8px;
      padding: 10px 20px;
      transition: 0.3s;
    }
    .btn-custom:hover {
      background: #ed610a;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center">Prediction Results for Rank: {{ user_rank }}</h2>
    <p class="message text-center">{{ message }}</p>

    <div class="table-responsive">
      {% for table in tables %}
        {{ table|safe }}
      {% endfor %}
    </div>

    <div class="text-center mt-4">
      <a href="/download">
        <button class="btn btn-custom">⬇ Download PDF</button>
      </a>
    </div>
  </div>
</body>
</html>
