<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoSAA Closing Rank Predictor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
      width: 420px;
    }
    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin: 12px 0 6px; }
    select, input[type="number"] {
      width: 100%; padding: 10px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 14px;
    }
    button {
      margin-top: 20px; width: 100%; padding: 12px;
      background: #007bff; color: #fff; font-size: 16px;
      font-weight: bold; border: none; border-radius: 8px;
      cursor: pointer; transition: 0.3s;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="container">
    <h2>JoSAA Closing Rank Predictor</h2>
    <form action="/predictdata" method="post">

      <!-- Rank -->
      <label>Your JEE Main Rank:</label>
      <input type="number" name="Rank" min="1" required>

      <!-- Seat Type -->
      <label>Category (Seat Type):</label>
      <select name="Seat_Type">
        <option value="OPEN">OPEN</option>
        <option value="OBC-NCL">OBC-NCL</option>
        <option value="SC">SC</option>
        <option value="ST">ST</option>
        <option value="EWS">EWS</option>
      </select>

      <!-- Quota -->
      <label>Quota:</label>
      <select name="Quota">
        <option value="OS">Other State</option>
        <option value="HS">Home State</option>
        <option value="JK">Jammu/Kashmir</option>
        <option value="LA">Ladakh</option>
      </select>

      <!-- Gender -->
      <label>Gender:</label>
      <select name="Gender">
        <option value="1">Male</option>
        <option value="0">Female</option>
      </select>

      <!-- PWD -->
      <label>PWD:</label>
      <select name="PWD">
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>

      <!-- Year -->
      <label>Year:</label>
      <input type="number" name="Year" min="2016" max="2030" required>

      <button type="submit">Predict Eligible Colleges</button>
    </form>
  </div>
</body>
</html>
